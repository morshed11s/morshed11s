<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#202024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#d4d4d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4d4d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
    <style>
      .name { font: 700 54px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #fafafa; letter-spacing: 0.5px; }
      .sub  { font: 600 15px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #a1a1aa; letter-spacing: 4px; }
      .line { font: 500 18px Consolas, Menlo, 'Courier New', monospace; fill: #e4e4e7; opacity: 0; }
      .pr   { fill: #71717a; }
      .l1 { animation: show 12s infinite 0s; }
      .l2 { animation: show 12s infinite 3s; }
      .l3 { animation: show 12s infinite 6s; }
      .l4 { animation: show 12s infinite 9s; }
      @keyframes show { 0% { opacity: 0; } 3% { opacity: 1; } 22% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .node { animation: pulse 3s ease-in-out infinite; }
      .d2 { animation-delay: 1s; } .d3 { animation-delay: 2s; }
      @keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- abstract infrastructure graph -->
    <g stroke="#3f3f46" stroke-width="1.5" fill="none">
      <path d="M870 70 L960 120 L1060 80 M960 120 L940 200 L1060 180 L1060 80 M1060 180 L1130 130 L1060 80"/>
    </g>
    <g fill="#232327" stroke="#d4d4d8" stroke-width="2">
      <circle class="node" cx="870" cy="70" r="6"/>
      <circle class="node d2" cx="960" cy="120" r="8"/>
      <circle class="node d3" cx="1060" cy="80" r="6"/>
      <circle class="node d2" cx="940" cy="200" r="5"/>
      <circle class="node" cx="1060" cy="180" r="7"/>
      <circle class="node d3" cx="1130" cy="130" r="5"/>
    </g>

    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#3f3f46"/>

  <text x="56" y="104" class="name">Sumaiya Morshed</text>
  <rect x="58" y="124" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="56" y="160" class="sub">DEVOPS  ·  CLOUD  ·  SOFTWARE ENGINEERING</text>

  <text x="56" y="210" class="line l1"><tspan class="pr">$</tspan> terraform plan -out=tfplan</text>
  <text x="56" y="210" class="line l2"><tspan class="pr">$</tspan> docker build -t api:1.4.2 .</text>
  <text x="56" y="210" class="line l3"><tspan class="pr">$</tspan> kubectl rollout status deploy/api</text>
  <text x="56" y="210" class="line l4"><tspan class="pr">$</tspan> helm install monitoring kube-prometheus-stack</text>
</svg>
