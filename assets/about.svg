<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2c5364" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      .mono { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 17px; }
      .num  { fill: #3b5563; }
      .k { fill: #7dd3fc; }
      .p { fill: #94a3b8; }
      .v { fill: #e2e8f0; }
      .s { fill: #a5d6a7; }
      .b { fill: #f8bbd0; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #94a3b8; }
      .row { animation: in 0.5s ease-out backwards; }
      .r1 { animation-delay: 0.2s; } .r2 { animation-delay: 0.5s; } .r3 { animation-delay: 0.8s; }
      .r4 { animation-delay: 1.1s; } .r5 { animation-delay: 1.4s; } .r6 { animation-delay: 1.7s; }
      .r7 { animation-delay: 2.0s; } .r8 { animation-delay: 2.3s; }
      @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
      .cursor { fill: #4fc3f7; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="368" rx="16" fill="#0d1b22" stroke="url(#edge)" stroke-width="2"/>
  <path d="M1 17 a16 16 0 0 1 16 -16 H1083 a16 16 0 0 1 16 16 V46 H1 Z" fill="#13262f"/>
  <circle cx="30" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="24" r="7" fill="#27c93f"/>
  <text x="550" y="29" text-anchor="middle" class="title">sumaiya@cloud: ~/about-me.yaml</text>

  <g class="mono">
    <g class="row r1"><text x="30" y="90" class="num">1</text><text x="70" y="90"><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">"Sumaiya Morshed"</tspan></text></g>
    <g class="row r2"><text x="30" y="124" class="num">2</text><text x="70" y="124"><tspan class="k">role</tspan><tspan class="p">: </tspan><tspan class="v">DevOps &amp; Cloud Trainee @ BJIT Academy</tspan></text></g>
    <g class="row r3"><text x="30" y="158" class="num">3</text><text x="70" y="158"><tspan class="k">education</tspan><tspan class="p">: </tspan><tspan class="v">B.Sc. Computer Science, Asian University for Women</tspan></text></g>
    <g class="row r4"><text x="30" y="192" class="num">4</text><text x="70" y="192"><tspan class="k">based_in</tspan><tspan class="p">: </tspan><tspan class="v">Bangladesh</tspan></text></g>
    <g class="row r5"><text x="30" y="226" class="num">5</text><text x="70" y="226"><tspan class="k">focus</tspan><tspan class="p">: </tspan><tspan class="b">[</tspan><tspan class="v">Cloud Infrastructure, CI/CD, Containers, IaC</tspan><tspan class="b">]</tspan></text></g>
    <g class="row r6"><text x="30" y="260" class="num">6</text><text x="70" y="260"><tspan class="k">learning_now</tspan><tspan class="p">: </tspan><tspan class="b">[</tspan><tspan class="v">AWS Solutions Architect</tspan><tspan class="b">]</tspan></text></g>
    <g class="row r7"><text x="30" y="294" class="num">7</text><text x="70" y="294"><tspan class="k">fun_fact</tspan><tspan class="p">: </tspan><tspan class="s">"I'd rather spend 3 hours automating than 3 minutes doing it by hand."</tspan></text></g>
    <g class="row r8"><text x="30" y="336" class="num">8</text><text x="70" y="336" class="k">❯</text><rect class="cursor" x="92" y="321" width="10" height="20"/></g>
  </g>
</svg>
