<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" width="1100" height="230">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb9c9"/>
    </linearGradient>
    <style>
      .t  { font: 600 19px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .d  { font: 400 14px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #8b949e; }
      .tl { font: 500 12.5px Consolas, Menlo, 'Courier New', monospace; fill: #79c0ff; }
      .c  { animation: up 0.6s ease-out backwards; }
      .c1 { animation-delay: 0.1s; } .c2 { animation-delay: 0.3s; } .c3 { animation-delay: 0.5s; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <g class="c c1">
    <rect x="10.5" y="15.5" width="340" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="11" y="16" width="339" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="34" y="46" width="48" height="48" rx="10" fill="#161b22" stroke="#30363d"/>
    <path d="M45 80 h26 a8 8 0 0 0 0 -16 a11 11 0 0 0 -21 -3 a7 7 0 0 0 -5 19 z" fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="98" y="77" class="t">Cloud Infrastructure</text>
    <text x="35" y="132" class="d">Secure VPCs, private subnets, load</text>
    <text x="35" y="154" class="d">balancers and CDNs on AWS</text>
    <line x1="35" y1="172" x2="325" y2="172" stroke="#21262d"/>
    <text x="35" y="196" class="tl">EC2 · VPC · ALB · CloudFront</text>
  </g>

  <g class="c c2">
    <rect x="380.5" y="15.5" width="340" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="381" y="16" width="339" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="404" y="46" width="48" height="48" rx="10" fill="#161b22" stroke="#30363d"/>
    <path d="M428 70 c-5 -8 -16 -8 -16 0 s11 8 16 0 c5 -8 16 -8 16 0 s-11 8 -16 0 z" fill="none" stroke="#58a6ff" stroke-width="2.2"/>
    <text x="468" y="77" class="t">CI/CD &amp; Automation</text>
    <text x="405" y="132" class="d">Pipelines that build, test and scan</text>
    <text x="405" y="154" class="d">code before it ships</text>
    <line x1="405" y1="172" x2="695" y2="172" stroke="#21262d"/>
    <text x="405" y="196" class="tl">Jenkins · Bash · Python · Ansible</text>
  </g>

  <g class="c c3">
    <rect x="750.5" y="15.5" width="340" height="200" rx="12" fill="#0d1117" stroke="#30363d"/>
    <rect x="751" y="16" width="339" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="774" y="46" width="48" height="48" rx="10" fill="#161b22" stroke="#30363d"/>
    <g fill="none" stroke="#58a6ff" stroke-width="2.2">
      <rect x="786" y="58" width="11" height="11" rx="2"/>
      <rect x="800" y="58" width="11" height="11" rx="2"/>
      <rect x="786" y="72" width="11" height="11" rx="2"/>
      <rect x="800" y="72" width="11" height="11" rx="2"/>
    </g>
    <text x="838" y="77" class="t">Containers &amp; IaC</text>
    <text x="775" y="132" class="d">Reproducible apps and infrastructure</text>
    <text x="775" y="154" class="d">defined entirely as code</text>
    <line x1="775" y1="172" x2="1065" y2="172" stroke="#21262d"/>
    <text x="775" y="196" class="tl">Docker · Kubernetes · Terraform</text>
  </g>
</svg>
