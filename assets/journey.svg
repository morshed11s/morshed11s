<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1100 220" width="1100" height="220">
  <defs>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="990" y2="0">
      <stop offset="0%" stop-color="#d7c4ff"/>
      <stop offset="100%" stop-color="#9ad5d0"/>
    </linearGradient>
    <style>
      .yr { font: 700 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6d67bf; }
      .ti { font: 700 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4d486c; }
      .pl { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #66718a; }
      .lo { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7a7ea1; }
      .line { stroke-dasharray: 880; animation: draw 2s ease-out backwards; }
      @keyframes draw { from { stroke-dashoffset: 880; } to { stroke-dashoffset: 0; } }
      .n { animation: pop 0.5s ease-out backwards; }
      .n1 { animation-delay: 0.2s; } .n2 { animation-delay: 0.6s; } .n3 { animation-delay: 1.0s; }
      .n4 { animation-delay: 1.4s; } .n5 { animation-delay: 1.8s; }
      @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
      @keyframes ring { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.4); opacity: 0; } }
    </style>
  </defs>

  <line class="line" x1="110" y1="125" x2="990" y2="125" stroke="url(#track)" stroke-width="3" stroke-linecap="round"/>

  <g class="n n1">
    <text x="110" y="95" text-anchor="middle" class="yr">2022</text>
    <circle cx="110" cy="125" r="9" fill="#fffafc" stroke="#a9a2eb" stroke-width="3"/>
    <line x1="110" y1="134" x2="110" y2="160" stroke="#c9c2ff" stroke-width="2"/>
    <rect x="10" y="160" width="200" height="105" rx="12" fill="#fff7fb" stroke="#d9d1ff" stroke-width="1.5"/>
    <text x="110" y="192" text-anchor="middle" class="ti">Started B.Sc. in CS</text>
    <text x="110" y="216" text-anchor="middle" class="pl">Asian University for Women</text>
    <text x="110" y="240" text-anchor="middle" class="lo">Chattogram</text>
  </g>

  <g class="n n2">
    <text x="330" y="95" text-anchor="middle" class="yr">2022–23</text>
    <circle cx="330" cy="125" r="9" fill="#fffafc" stroke="#a9a2eb" stroke-width="3"/>
    <line x1="330" y1="134" x2="330" y2="160" stroke="#c9c2ff" stroke-width="2"/>
    <rect x="230" y="160" width="200" height="105" rx="12" fill="#f7f4ff" stroke="#d9d1ff" stroke-width="1.5"/>
    <text x="330" y="192" text-anchor="middle" class="ti">Research Intern</text>
    <text x="330" y="216" text-anchor="middle" class="pl">BILS</text>
    <text x="330" y="240" text-anchor="middle" class="lo">Chattogram</text>
  </g>

  <g class="n n3">
    <text x="550" y="95" text-anchor="middle" class="yr">2024</text>
    <circle cx="550" cy="125" r="9" fill="#fffafc" stroke="#a9a2eb" stroke-width="3"/>
    <line x1="550" y1="134" x2="550" y2="160" stroke="#c9c2ff" stroke-width="2"/>
    <rect x="450" y="160" width="200" height="105" rx="12" fill="#f7fbff" stroke="#d9e8ff" stroke-width="1.5"/>
    <text x="550" y="192" text-anchor="middle" class="ti">Summer Exchange</text>
    <text x="550" y="216" text-anchor="middle" class="pl">The University of Tokyo</text>
    <text x="550" y="240" text-anchor="middle" class="lo">Japan</text>
  </g>

  <g class="n n4">
    <text x="770" y="95" text-anchor="middle" class="yr">2025</text>
    <circle cx="770" cy="125" r="9" fill="#fffafc" stroke="#a9a2eb" stroke-width="3"/>
    <line x1="770" y1="134" x2="770" y2="160" stroke="#c9c2ff" stroke-width="2"/>
    <rect x="670" y="160" width="200" height="105" rx="12" fill="#fffaf5" stroke="#f9ddbf" stroke-width="1.5"/>
    <text x="770" y="192" text-anchor="middle" class="ti">IT Operations Intern</text>
    <text x="770" y="216" text-anchor="middle" class="pl">BNP Paribas</text>
    <text x="770" y="240" text-anchor="middle" class="lo">Hong Kong</text>
  </g>

  <g class="n n5">
    <text x="990" y="95" text-anchor="middle" class="yr">2026 · Now</text>
    <circle class="pulse" cx="990" cy="125" r="9" fill="#b9dce0"/>
    <circle cx="990" cy="125" r="9" fill="#b9dce0" stroke="#7f9cd9" stroke-width="3"/>
    <line x1="990" y1="134" x2="990" y2="160" stroke="#8cb8d8" stroke-width="2"/>
    <rect x="890" y="160" width="200" height="105" rx="12" fill="#f4f8ff" stroke="#bfd9ff" stroke-width="1.5"/>
    <text x="990" y="192" text-anchor="middle" class="ti">DevOps &amp; Cloud Trainee</text>
    <text x="990" y="216" text-anchor="middle" class="pl">BJIT Academy</text>
    <text x="990" y="240" text-anchor="middle" class="lo">Bangladesh</text>
  </g>
</svg>
