<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="35%" stop-color="#f3eeff"/>
      <stop offset="70%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff9ef"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe9ff"/>
      <stop offset="100%" stop-color="#e7d6ff"/>
    </linearGradient>
    <style>
      .name { font: 700 58px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b3d75; letter-spacing: 1px; }
      .sub  { font: 600 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7a6ac0; letter-spacing: 3px; }
      .line { font: 500 20px Consolas, 'Courier New', monospace; fill: #5a7fd5; opacity: 0; }
      .l1 { animation: show 12s infinite 0s; }
      .l2 { animation: show 12s infinite 3s; }
      .l3 { animation: show 12s infinite 6s; }
      .l4 { animation: show 12s infinite 9s; }
      @keyframes show {
        0%   { opacity: 0; }
        3%   { opacity: 1; }
        22%  { opacity: 1; }
        25%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .wave1 { animation: drift 11s ease-in-out infinite alternate; }
      .wave2 { animation: drift 15s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
      .cursor { fill: #6e82d7; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="26" fill="url(#bg)"/>

  <g opacity="0.7">
    <circle cx="90" cy="60" r="2.5" fill="#f7bfd3"/><circle cx="260" cy="40" r="2" fill="#b9d9ff"/>
    <circle cx="980" cy="50" r="2.5" fill="#d7c9ff"/><circle cx="1110" cy="90" r="2" fill="#bfe7d3"/>
    <circle cx="700" cy="30" r="2" fill="#f9d6a5"/><circle cx="420" cy="80" r="1.8" fill="#b9d9ff"/>
  </g>

  <path class="wave1" d="M0 230 C200 200 400 260 600 230 S1000 200 1260 230 V280 H0 Z" fill="url(#wave1)" opacity="0.62"/>
  <path class="wave2" d="M0 250 C250 225 450 275 700 250 S1050 225 1260 250 V280 H0 Z" fill="#d7c9ff" opacity="0.55"/>

  <text x="48" y="110" text-anchor="start" class="name">Sumaiya Morshed</text>
  <text x="48" y="148" text-anchor="start" class="sub">DEVOPS • CLOUD • SOFTWARE ENGINEERING</text>

  <text x="48" y="198" text-anchor="start" class="line l1">&gt; Building infrastructure that just works ☁️</text>
  <text x="48" y="198" text-anchor="start" class="line l2">&gt; Terraform • Docker • Kubernetes • AWS</text>
  <text x="48" y="198" text-anchor="start" class="line l3">&gt; Java &amp; Spring Boot developer</text>
  <text x="48" y="198" text-anchor="start" class="line l4">&gt; Automating everything I touch 🤖</text>
</svg>
