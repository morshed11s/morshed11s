<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370">
  <defs>
    <style>
      .mono { font-family: Consolas, Menlo, 'Courier New', monospace; font-size: 17px; }
      .num  { fill: #52525b; }
      .k { fill: #d4d4d8; font-weight: 600; }
      .p { fill: #71717a; }
      .v { fill: #fafafa; }
      .s { fill: #a1a1aa; font-style: italic; }
      .b { fill: #71717a; }
      .title { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; fill: #a1a1aa; }
      .row { animation: in 0.5s ease-out backwards; }
      .r1 { animation-delay: 0.2s; } .r2 { animation-delay: 0.45s; } .r3 { animation-delay: 0.7s; }
      .r4 { animation-delay: 0.95s; } .r5 { animation-delay: 1.2s; } .r6 { animation-delay: 1.45s; }
      .r7 { animation-delay: 1.7s; } .r8 { animation-delay: 1.95s; }
      @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      .cursor { fill: #d4d4d8; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="369" rx="12" fill="#18181b" stroke="#3f3f46"/>
  <path d="M0.5 12.5 a12 12 0 0 1 12 -12 H1087.5 a12 12 0 0 1 12 12 V44 H0.5 Z" fill="#232327"/>
  <line x1="0.5" y1="44" x2="1099.5" y2="44" stroke="#3f3f46"/>
  <circle cx="28" cy="22" r="6" fill="#71717a"/>
  <circle cx="48" cy="22" r="6" fill="#a1a1aa"/>
  <circle cx="68" cy="22" r="6" fill="#d4d4d8"/>
  <text x="550" y="27" text-anchor="middle" class="title">sumaiya@cloud: ~/about-me.yaml</text>
  <rect x="0.5" y="44" width="50" height="325" fill="#141416"/>

  <g class="mono">
    <g class="row r1"><text x="20" y="88" class="num">1</text><text x="70" y="88"><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">"Sumaiya Morshed"</tspan></text></g>
    <g class="row r2"><text x="20" y="122" class="num">2</text><text x="70" y="122"><tspan class="k">role</tspan><tspan class="p">: </tspan><tspan class="v">DevOps &amp; Cloud Trainee @ BJIT Limited</tspan></text></g>
    <g class="row r3"><text x="20" y="156" class="num">3</text><text x="70" y="156"><tspan class="k">education</tspan><tspan class="p">: </tspan><tspan class="v">B.Sc. Computer Science, Asian University for Women</tspan></text></g>
    <g class="row r4"><text x="20" y="190" class="num">4</text><text x="70" y="190"><tspan class="k">based_in</tspan><tspan class="p">: </tspan><tspan class="v">Bangladesh</tspan></text></g>
    <g class="row r5"><text x="20" y="224" class="num">5</text><text x="70" y="224"><tspan class="k">focus</tspan><tspan class="p">: </tspan><tspan class="b">[</tspan><tspan class="v">Cloud Infrastructure, CI/CD, Containers, IaC, Observability</tspan><tspan class="b">]</tspan></text></g>
    <g class="row r6"><text x="20" y="258" class="num">6</text><text x="70" y="258"><tspan class="k">learning_now</tspan><tspan class="p">: </tspan><tspan class="b">[</tspan><tspan class="v">AWS Solutions Architect</tspan><tspan class="b">]</tspan></text></g>
    <g class="row r7"><text x="20" y="292" class="num">7</text><text x="70" y="292"><tspan class="k">previously</tspan><tspan class="p">: </tspan><tspan class="v">IT Operations Intern @ BNP Paribas, Hong Kong</tspan></text></g>
    <g class="row r8"><text x="20" y="334" class="num">8</text><text x="70" y="334" class="p">❯</text><rect class="cursor" x="90" y="319" width="9" height="19"/></g>
  </g>
</svg>
